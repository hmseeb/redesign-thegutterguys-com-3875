<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="The Gutter Guys">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2d48"/>
      <stop offset="1" stop-color="#071a2c"/>
    </linearGradient>
    <linearGradient id="rain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3aa4f0"/>
      <stop offset="1" stop-color="#0a72c4"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- roof line -->
  <path d="M10 26 32 12l22 14" fill="none" stroke="#eaa96a" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- gutter trough -->
  <path d="M12 32h40v5a6 6 0 0 1-6 6H18a6 6 0 0 1-6-6v-5Z" fill="url(#rain)"/>
  <!-- downspout -->
  <path d="M44 43h5v11h-5z" fill="#eaa96a"/>
  <!-- water drops -->
  <circle cx="21" cy="50" r="2.6" fill="#3aa4f0"/>
  <circle cx="30" cy="54" r="2" fill="#3aa4f0" opacity=".8"/>
</svg>
